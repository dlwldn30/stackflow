name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew test --no-daemon

  trace-lab:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, product-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./examples/distributed-trace-lab/${{ matrix.service }}/gradlew -p examples/distributed-trace-lab/${{ matrix.service }} test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  demo-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose config
      - run: docker compose up --build --wait
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: ./scripts/verify-demo.sh
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: output/playwright
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log
          retention-days: 7
      - if: always()
        run: docker compose down --volumes
